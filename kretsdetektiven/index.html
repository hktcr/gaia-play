<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112420"><title>Kretsdetektiven · Ellära</title><style>*{box-sizing:border-box}body{margin:0;background:#112420;color:#f1f3e9;font:17px/1.56 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:clamp(18px,5vw,50px)}.tag{color:#ffcc77;font-size:.82rem;font-weight:750;letter-spacing:.14em}h1{font-family:Georgia,serif;font-size:clamp(2.35rem,7vw,4.4rem);line-height:1.05;margin:.2em 0}h2{line-height:1.2}p{margin:.5em 0 1em}a{color:#ffd28b}section{background:#19322a;border:1px solid #476655;border-radius:18px;padding:clamp(14px,4vw,32px);margin:1.4em 0}.diagram{background:#f5f7ed;border-radius:12px;color:#182c23;padding:.4em;margin:.8em 0}.diagram svg{display:block;width:100%;max-height:240px;margin:auto}.opts,.tools{display:flex;gap:.65em;flex-wrap:wrap;margin:.9em 0}button{font:inherit;border:1px solid #7c9a88;background:#263f33;color:#fff;border-radius:.65em;min-height:46px;padding:.4em .75em;cursor:pointer}button.primary{background:#ffd185;color:#242116;border-color:#ffd185;font-weight:700}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#ffd185;color:#242116}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #ffd185;outline-offset:4px}.feedback{min-height:3em}.muted,small{color:#c0d1c4}summary{cursor:pointer}footer{margin-top:1.5em}[hidden]{display:none!important}</style></head><body><main><header><p class=tag>EXTRAÖVNING · ELLÄRA</p><h1>Kretsdetektiven</h1><p>Tre fall. Förutsäg vad som händer, pröva i PhET och förklara vilken väg strömmen kan ta.</p></header><section aria-labelledby=q><p class=tag id=progress></p><h2 id=q></h2><div class=diagram id=diagram></div><div class=opts id=choices aria-label="Välj vilka lampor som lyser"></div><p id=feedback class=feedback role=status></p><div id=after hidden><h3>Pröva själv</h3><p id=try></p><p><a href="https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc_sv.html" target="_blank" rel="noopener">Öppna PhET på svenska</a></p><details><summary>Förklara med egna ord</summary><p id=why></p></details></div><div class=tools><button id=prev>Föregående kort</button><button class=primary id=next>Nästa kort</button></div></section><footer><p class=muted>Passar efter serie- och parallellkoppling, elevhäftet s. 10. Inga svar samlas in.</p><a href="../ord-i-kretsen/">Språkstöd: Ord i kretsen</a></footer></main><script>const $=x=>document.getElementById(x);
function lamp(x,y,label='',lit=false){return `<circle cx="${x}" cy="${y}" r="18" fill="${lit?'#ffda7b':'#f5f7ed'}"/><path d="m${x-10} ${y-10} 20 20m-20 0 20 -20"/>${label?`<text x="${x}" y="${y-28}" text-anchor="middle">${label}</text>`:''}`}
function sw(x,y,open){return `<circle cx="${x}" cy="${y}" r="3"/><circle cx="${x+38}" cy="${y}" r="3"/><path d="M${x} ${y}l38 ${open?-21:0}"/>`}
function svg(inner,label){return `<svg viewBox="0 0 410 245" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg"><style>text{font:700 15px system-ui;stroke:none;fill:#172f24}</style><g fill="none" stroke="#1c3a2b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`}
const battery='<path d="M175 212v-16m0 16v16m12-26v20"/><text x="162" y="242">+</text><text x="187" y="242">−</text>';
function choices(values,fn){$('choices').replaceChildren(...values.map(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>fn(v,b);return b}));}

const cards=[
{q:'1. Vad händer när brytaren öppnas i serien?',alt:'Ett batteri, lamporna A och B och en öppen brytare sitter i samma slinga.',right:'Ingen',try:'Bygg en slinga med ett batteri, två lampor och en brytare. Stäng brytaren; öppna den sedan.',reason:'Båda lamporna delar en enda väg. När den bryts kan ingen ström gå genom någon lampa.'},
{q:'2. Vad händer när bara A:s gren bryts?',alt:'A och B har var sin gren. Brytaren i A:s gren är öppen. B:s gren är hel.',right:'Bara B',try:'Bygg två parallella lampgrenar. Sätt en brytare i A:s gren och öppna den.',reason:'A saknar en sluten väg. B har fortfarande en fullständig väg från den ena polen tillbaka till den andra.'},
{q:'3. Båda lamporna slocknade. Var ska du leta?',alt:'A och B ligger i var sin parallell gren. Båda lamporna är släckta. Ledningarna är ritade utan synligt glapp.',opts:['I A:s gren','I B:s gren','I ledningen gemensam för A och B'],right:'I ledningen gemensam för A och B',try:'Flytta brytaren från A:s gren till ledningen mellan batteriet och förgreningen. Testa vad som händer när du öppnar den.',reason:'Båda strömvägarna använder den gemensamma ledningen. Bryts den kan ingen av vägarna slutas.'}];
let i=0;
function drawing(i,show){if(i===0)return '<path d="M175 212H45V70H85M123 70h24m36 0h60m36 0h77v142H187"/>'+battery+sw(85,70,true)+lamp(165,70,'A')+lamp(261,70,'B');
const middle=i===1?'<path d="M70 65h59m38 0h69m36 0h68"/> '+sw(129,65,true):'<path d="M70 65h166m36 0h68"/>';
const lower=i===1||!show?'<path d="M70 212h105m12 0h153V65M70 212V65"/>':'<path d="M70 212h105m12 0h51m38 0h64V65M70 212V65"/>'+sw(238,212,true);
return middle+lower+battery+'<path d="M70 135h166m36 0h68"/><circle cx="70" cy="135" r="3" fill="#1c3a2b"/><circle cx="340" cy="135" r="3" fill="#1c3a2b"/>'+lamp(254,65,'A')+lamp(254,135,'B',show&&i===1);}
function render(){const c=cards[i];$('progress').textContent='FALL '+(i+1)+' / '+cards.length;$('q').textContent=c.q;$('diagram').innerHTML=svg(drawing(i,false),c.alt);$('feedback').textContent='';$('after').hidden=true;$('after').querySelector('details').open=false;$('prev').disabled=i===0;$('next').disabled=true;$('next').textContent=i===2?'Börja om':'Nästa kort';choices(c.opts||['Båda','Bara A','Bara B','Ingen'],(a,b)=>{if(a!==c.right){$('feedback').textContent='Inte riktigt. Följ varje möjlig väg från batteriet och tillbaka. Försök igen.';return} $('feedback').textContent='Rätt. Pröva nu samma idé i PhET.';$('diagram').innerHTML=svg(drawing(i,true),c.alt+(i===1?' Lampa B lyser.':i===2?' Nu visas ett glapp i den gemensamma ledningen.':' Ingen lampa lyser.'));$('try').textContent=c.try;$('why').textContent=c.reason;$('after').hidden=false;$('next').disabled=false;[...$('choices').children].forEach(x=>x.disabled=true);});}
$('prev').onclick=()=>{i--;render();$('q').focus()};$('next').onclick=()=>{i=(i+1)%cards.length;render();$('q').focus()};$('q').tabIndex=-1;render();</script></body></html>
